<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{default}">
<head>
    <title>Gerenciar conta</title>
    <link rel="stylesheet" th:href="@{/css/edit-user.css}">
</head>
<body>
    <div layout:fragment="content">
        <section class="edit-user-page">
            <article class="round large-padding surface-container-lowest">
                <nav class="row middle-align wrap">
                    <a th:href="@{/perfil}" class="button transparent circle" aria-label="Voltar">
                        <i>arrow_back</i>
                    </a>
                    <h4 class="max no-margin">Gerenciar conta</h4>
                </nav>

                <div th:if="${success}" class="snackbar active success-message" th:text="${success}">
                    Perfil atualizado com sucesso.
                </div>

                <div th:if="${error}" class="snackbar active error-message" th:text="${error}">
                    Erro ao atualizar perfil.
                </div>

                <form th:action="@{/user}" method="post" enctype="multipart/form-data" class="top-margin">
                    <div class="grid large-space">
                        <section class="s12 m4 profile-section">
                            <div class="profile-photo-circle">
                                <img id="fotoPreview"
                                     th:src="${usuario.fotoPerfil != null and !usuario.fotoPerfil.isBlank() ? usuario.fotoPerfil : '/img/pouso-icon.png'}"
                                     th:alt="|Foto de ${usuario.nome}|"
                                     th:hidden="${usuario.fotoPerfil == null or usuario.fotoPerfil.isBlank()}"
                                     class="profile-photo-preview">
                                <i id="fotoFallback"
                                   th:hidden="${usuario.fotoPerfil != null and !usuario.fotoPerfil.isBlank()}"
                                   class="profile-photo-icon">account_circle</i>
                            </div>

                            <input type="hidden" id="fotoPerfil" name="fotoPerfil" th:value="${usuario.fotoPerfil}">
                            <input type="hidden" id="removerFotoValue" name="removerFoto" value="false">
                            <input type="file" id="fotoArquivo" name="fotoArquivo" accept="image/*" class="photo-file-input">

                            <div class="profile-photo-actions">
                                <label for="fotoArquivo" class="button border">
                                    <i>upload</i>
                                    <span>Escolher foto</span>
                                </label>

                                <button type="button" id="removerFoto" class="border">
                                    <i>delete</i>
                                    <span>Remover</span>
                                </button>
                            </div>
                        </section>

                        <section class="s12 m8">
                            <h5>Dados pessoais</h5>

                            <div class="grid">
                                <div class="s12">
                                    <div class="field label filled">
                                        <input name="nome" th:value="${usuario.nome}" required placeholder=" ">
                                        <label>Nome completo</label>
                                    </div>
                                </div>

                                <div class="s12 m6">
                                    <div class="field label filled">
                                        <input name="cpf" th:value="${usuario.cpf}" readonly placeholder=" ">
                                        <label>CPF</label>
                                    </div>
                                </div>

                                <div class="s12 m6">
                                    <div class="field label filled">
                                        <input name="telefone" th:value="${usuario.telefone}" maxlength="11" required placeholder=" ">
                                        <label>Telefone</label>
                                    </div>
                                </div>

                                <div class="s12">
                                    <div class="field label filled">
                                        <input type="email" name="email" th:value="${usuario.email}" required placeholder=" ">
                                        <label>E-mail</label>
                                    </div>
                                </div>
                            </div>

                            <h5 class="top-margin">Perfil</h5>

                            <div class="grid">
                                <div class="s12 m6">
                                    <div class="field label filled">
                                        <input name="username" th:value="${usuario.username}" required placeholder=" ">
                                        <label>Username</label>
                                    </div>
                                </div>

                                <div class="s12 m6">
                                    <div class="gender-group">
                                        <p class="small-text bold no-margin">Genero</p>

                                        <div class="row wrap small-space top-margin">
                                            <label class="radio">
                                                <input type="radio" name="genero" value="M" th:checked="${usuario.genero == 'M'}">
                                                <span>Masculino</span>
                                            </label>

                                            <label class="radio">
                                                <input type="radio" name="genero" value="F" th:checked="${usuario.genero == 'F'}">
                                                <span>Feminino</span>
                                            </label>

                                            <label class="radio">
                                                <input type="radio" name="genero" value="O" th:checked="${usuario.genero == 'O'}">
                                                <span>Outro</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="s12">
                                    <div class="field label filled textarea">
                                        <textarea name="bio" maxlength="255" th:text="${usuario.bio}" placeholder=" "></textarea>
                                        <label>Bio</label>
                                    </div>
                                </div>
                            </div>

                            <h5 class="top-margin">Endereco</h5>

                            <div class="grid">
                                <div class="s12 m4">
                                    <div class="field label filled">
                                        <input name="cep" th:value="${endereco.cep}" maxlength="8" required placeholder=" ">
                                        <label>CEP</label>
                                    </div>
                                </div>

                                <div class="s12 m8">
                                    <div class="field label filled">
                                        <input name="rua" th:value="${endereco.rua}" required placeholder=" ">
                                        <label>Rua</label>
                                    </div>
                                </div>

                                <div class="s12 m4">
                                    <div class="field label filled">
                                        <input name="numero" th:value="${endereco.numero}" required placeholder=" ">
                                        <label>Numero</label>
                                    </div>
                                </div>

                                <div class="s12 m8">
                                    <div class="field label filled">
                                        <input name="complemento" th:value="${endereco.complemento}" placeholder=" ">
                                        <label>Complemento</label>
                                    </div>
                                </div>

                                <div class="s12 m5">
                                    <div class="field label filled">
                                        <input name="bairro" th:value="${endereco.bairro}" required placeholder=" ">
                                        <label>Bairro</label>
                                    </div>
                                </div>

                                <div class="s12 m5">
                                    <div class="field label filled">
                                        <input name="cidade" th:value="${endereco.cidade}" required placeholder=" ">
                                        <label>Cidade</label>
                                    </div>
                                </div>

                                <div class="s12 m2">
                                    <div class="field label filled">
                                        <input name="uf" th:value="${endereco.uf}" maxlength="2" required placeholder=" ">
                                        <label>Estado</label>
                                    </div>
                                </div>
                            </div>

                            <h5 class="top-margin">Seguranca</h5>

                            <div class="grid">
                                <div class="s12">
                                    <div class="field label filled">
                                        <input type="password" name="senha" th:value="${usuario.senha}" required placeholder=" ">
                                        <label>Senha</label>
                                    </div>
                                </div>
                            </div>

                            <div class="row right-align wrap small-space top-margin">
                                <a th:href="@{/perfil}" class="button transparent">Cancelar</a>
                                <button type="submit" class="primary">
                                    <i>save</i>
                                    <span>Salvar alteracoes</span>
                                </button>
                            </div>
                        </section>
                    </div>
                </form>
            </article>
        </section>

        <script>
            const fotoPerfil = document.getElementById("fotoPerfil");
            const fotoArquivo = document.getElementById("fotoArquivo");
            const fotoPreview = document.getElementById("fotoPreview");
            const fotoFallback = document.getElementById("fotoFallback");
            const removerFoto = document.getElementById("removerFoto");
            const removerFotoValue = document.getElementById("removerFotoValue");
            let previewUrl = null;

            function mostrarPreview(src) {
                if (!fotoPreview) return;

                if (src) {
                    fotoPreview.src = src;
                    fotoPreview.hidden = false;
                    if (fotoFallback) fotoFallback.hidden = true;
                } else {
                    fotoPreview.hidden = true;
                    if (fotoFallback) fotoFallback.hidden = false;
                }
            }

            if (fotoArquivo) {
                fotoArquivo.addEventListener("change", () => {
                    const arquivo = fotoArquivo.files && fotoArquivo.files[0];
                    if (!arquivo) return;

                    if (previewUrl) {
                        URL.revokeObjectURL(previewUrl);
                    }

                    previewUrl = URL.createObjectURL(arquivo);
                    if (removerFotoValue) removerFotoValue.value = "false";
                    mostrarPreview(previewUrl);
                });
            }

            if (removerFoto) {
                removerFoto.addEventListener("click", () => {
                    if (fotoArquivo) fotoArquivo.value = "";
                    if (fotoPerfil) fotoPerfil.value = "";
                    if (removerFotoValue) removerFotoValue.value = "true";
                    mostrarPreview("");
                });
            }
        </script>
    </div>
</body>
</html>
