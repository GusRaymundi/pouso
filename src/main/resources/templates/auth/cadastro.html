<!doctype html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/app}">

<head>
    <title>Cadastro</title>
</head>

<body>
<section layout:fragment="content">

    <article class="round surface">
        <header class="row middle-align bottom-margin">
            <i class="extra">account_circle</i>

            <div class="max">
                <h4>Cadastro</h4>

                <p class="no-margin">
                    Crie uma conta para usar o Pouso.
                </p>
            </div>
        </header>

        <article class="green white-text"
                 th:if="${success != null}">
            <i>check_circle</i>

            <span th:text="${success}">
                Cadastro realizado com sucesso.
            </span>
        </article>

        <article class="red white-text"
                 th:if="${error != null}">
            <i>error</i>

            <span th:text="${error}">
                Nao foi possivel realizar o cadastro.
            </span>
        </article>

        <form id="cadastroForm"
              th:action="@{/cadastro}"
              method="post">

            <div class="grid cadastro-step"
                 data-step="1">

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="nome"
                               name="nome"
                               type="text"
                               autocomplete="name"
                               required>

                        <label for="nome">Nome completo</label>
                        <i>person</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="cpf"
                               name="cpf"
                               type="text"
                               inputmode="numeric"
                               maxlength="11"
                               autocomplete="off"
                               required>

                        <label for="cpf">CPF</label>
                        <i>badge</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="username"
                               name="username"
                               type="text"
                               autocomplete="username"
                               required>

                        <label for="username">Nome de usuario</label>
                        <i>alternate_email</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="telefone"
                               name="telefone"
                               type="tel"
                               inputmode="tel"
                               maxlength="11"
                               autocomplete="tel"
                               required>

                        <label for="telefone">Telefone</label>
                        <i>phone</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="email"
                               name="email"
                               type="email"
                               autocomplete="email"
                               required>

                        <label for="email">E-mail</label>
                        <i>mail</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="password"
                               name="password"
                               type="password"
                               autocomplete="new-password"
                               required>

                        <label for="password">Senha</label>
                        <i>lock</i>
                    </div>
                </div>

                <fieldset class="s12">
                    <legend class="bold">Genero</legend>

                    <nav class="row wrap">
                        <label class="radio">
                            <input type="radio"
                                   name="genero"
                                   value="M"
                                   checked>

                            <span>Masculino</span>
                        </label>

                        <label class="radio">
                            <input type="radio"
                                   name="genero"
                                   value="F">

                            <span>Feminino</span>
                        </label>

                        <label class="radio">
                            <input type="radio"
                                   name="genero"
                                   value="O">

                            <span>Outro</span>
                        </label>
                    </nav>
                </fieldset>

                <nav class="s12 right-align top-margin">
                    <a th:href="@{/login}"
                       class="button border">
                        Ja tenho uma conta
                    </a>

                    <button id="btnSeguinte"
                            type="button"
                            class="primary">
                        <i>arrow_forward</i>
                        <span>Seguinte</span>
                    </button>
                </nav>
            </div>

            <div class="grid cadastro-step"
                 data-step="2"
                 hidden>

                <div class="s12 m4">
                    <div class="field label border">
                        <input id="cep"
                               name="cep"
                               type="text"
                               inputmode="numeric"
                               maxlength="8"
                               autocomplete="postal-code"
                               required
                               disabled>

                        <label for="cep">CEP</label>
                        <i>location_on</i>
                    </div>
                </div>

                <div class="s12 m8">
                    <div class="field label border">
                        <input id="rua"
                               name="rua"
                               type="text"
                               autocomplete="address-line1"
                               required
                               disabled>

                        <label for="rua">Rua</label>
                        <i>signpost</i>
                    </div>
                </div>

                <div class="s12 m4">
                    <div class="field label border">
                        <input id="numero"
                               name="numero"
                               type="text"
                               autocomplete="address-line2"
                               required
                               disabled>

                        <label for="numero">Numero</label>
                        <i>tag</i>
                    </div>
                </div>

                <div class="s12 m8">
                    <div class="field label border">
                        <input id="complemento"
                               name="complemento"
                               type="text"
                               disabled>

                        <label for="complemento">Complemento</label>
                        <i>home</i>
                    </div>
                </div>

                <div class="s12 m5">
                    <div class="field label border">
                        <input id="bairro"
                               name="bairro"
                               type="text"
                               required
                               disabled>

                        <label for="bairro">Bairro</label>
                        <i>map</i>
                    </div>
                </div>

                <div class="s12 m5">
                    <div class="field label border">
                        <input id="cidade"
                               name="cidade"
                               type="text"
                               autocomplete="address-level2"
                               required
                               disabled>

                        <label for="cidade">Cidade</label>
                        <i>location_city</i>
                    </div>
                </div>

                <div class="s12 m2">
                    <div class="field label border">
                        <input id="uf"
                               name="uf"
                               type="text"
                               maxlength="2"
                               autocomplete="address-level1"
                               required
                               disabled>

                        <label for="uf">Estado</label>
                        <i>flag</i>
                    </div>
                </div>

                <nav class="s12 row wrap right-align top-margin">
                    <button id="btnVoltar"
                            type="button"
                            class="border">
                        <i>arrow_back</i>
                        <span>Voltar</span>
                    </button>

                    <button type="submit"
                            class="primary">
                        <i>person_add</i>
                        <span>Finalizar cadastro</span>
                    </button>
                </nav>
            </div>
        </form>
    </article>

</section>

<th:block layout:fragment="scripts">
    <script>
        const cadastroForm = document.getElementById("cadastroForm");
        const primeiraEtapa = cadastroForm.querySelector('[data-step="1"]');
        const segundaEtapa = cadastroForm.querySelector('[data-step="2"]');
        const camposEndereco = segundaEtapa.querySelectorAll("input");
        const btnSeguinte = document.getElementById("btnSeguinte");
        const btnVoltar = document.getElementById("btnVoltar");

        function mostrarPrimeiraEtapa() {
            primeiraEtapa.hidden = false;
            segundaEtapa.hidden = true;
            camposEndereco.forEach((campo) => {
                campo.disabled = true;
            });
        }

        function mostrarSegundaEtapa() {
            camposEndereco.forEach((campo) => {
                campo.disabled = false;
            });
            primeiraEtapa.hidden = true;
            segundaEtapa.hidden = false;
        }

        btnSeguinte.addEventListener("click", () => {
            if (cadastroForm.reportValidity()) {
                mostrarSegundaEtapa();
            }
        });

        btnVoltar.addEventListener("click", mostrarPrimeiraEtapa);

        cadastroForm.addEventListener("submit", (event) => {
            if (segundaEtapa.hidden) {
                event.preventDefault();
                if (cadastroForm.reportValidity()) {
                    mostrarSegundaEtapa();
                }
            }
        });
    </script>
</th:block>
</body>
</html>
