<!doctype html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/app}">

<head>
    <title>Cadastro</title>
</head>

<body>
<section layout:fragment="content">

    <article class="round surface">
        <header class="row middle-align bottom-margin">
            <i class="extra">account_circle</i>

            <div class="max">
                <h4>Cadastro</h4>

                <p class="no-margin">
                    Crie uma conta para usar o Pouso.
                </p>
            </div>

        </header>

        <article class="green white-text"
                 th:if="${success != null}">
            <i>check_circle</i>

            <span th:text="${success}">
                Cadastro realizado com sucesso.
            </span>
        </article>

        <article class="red white-text"
                 th:if="${error != null}">
            <i>error</i>

            <span th:text="${error}">
                Não foi possível realizar o cadastro.
            </span>
        </article>

        <form th:action="@{/cadastro}"
              method="post">

            <div class="grid">

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="nome"
                               name="nome"
                               type="text"
                               autocomplete="name"
                               required>

                        <label for="nome">Nome completo</label>
                        <i>person</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="cpf"
                               name="cpf"
                               type="text"
                               inputmode="numeric"
                               maxlength="11"
                               autocomplete="off"
                               required>

                        <label for="cpf">CPF</label>
                        <i>badge</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="username"
                               name="username"
                               type="text"
                               autocomplete="username"
                               required>

                        <label for="username">Nome de usuário</label>
                        <i>alternate_email</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="telefone"
                               name="telefone"
                               type="tel"
                               inputmode="tel"
                               maxlength="11"
                               autocomplete="tel"
                               required>

                        <label for="telefone">Telefone</label>
                        <i>phone</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="email"
                               name="email"
                               type="email"
                               autocomplete="email"
                               required>

                        <label for="email">E-mail</label>
                        <i>mail</i>
                    </div>
                </div>

                <div class="s12 m6">
                    <div class="field label border">

                        <input id="password"
                               name="password"
                               type="password"
                               autocomplete="new-password"
                               required>

                        <label for="password">Senha</label>
                        <i>lock</i>
                    </div>
                </div>

                <fieldset class="s12">
                    <legend class="bold">Gênero</legend>

                    <nav class="row wrap">
                        <label class="radio">
                            <input type="radio"
                                   name="genero"
                                   value="M"
                                   checked>

                            <span>Masculino</span>
                        </label>

                        <label class="radio">
                            <input type="radio"
                                   name="genero"
                                   value="F">

                            <span>Feminino</span>
                        </label>

                        <label class="radio">
                            <input type="radio"
                                   name="genero"
                                   value="O">

                            <span>Outro</span>
                        </label>
                    </nav>
                </fieldset>

            </div>

            <nav class="right-align top-margin">
                <a th:href="@{/login}"
                   class="button border">
                    Já tenho uma conta
                </a>

                <button type="submit"
                        class="primary">
                    <i>person_add</i>
                    <span>Cadastrar</span>
                </button>
            </nav>
        </form>
    </article>

</section>
</body>
</html>
