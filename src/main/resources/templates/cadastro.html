<!doctype html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{default}"
>
<head>
    <title>Cadastro - Pouso</title>
    <style>
        .cadastro-page {
            min-height: calc(100vh - 128px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 24px;
        }

        .cadastro-card {
            width: 905px;
            min-height: 680px;
            background: var(--surface-container-low, #FFFFFF);
            border-radius: 18px;
            padding: 34px 42px;
        }

        .cadastro-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 42px;
        }

        .cadastro-card-title {
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 32px;
            font-weight: 400;
        }

        .cadastro-card-title img {
            width: 32px;
            height: 32px;
        }

        .cadastro-close {
            font-size: 42px;
            color: var(--on-surface-variant, #49454F);
        }

        .form-area {
            width: 739px;
            margin: 0 auto;
            padding: 28px 25px;
            display: grid;
            grid-template-columns: 212px 212px;
            column-gap: 58px;
            row-gap: 22px;
            justify-content: center;
            align-items: start;
        }

        .text-field {
            width: 212px;
            height: 56px;
            background: var(--surface-container-highest, #E6E0E9);
            border-radius: 4px 4px 0 0;
            border-bottom: 1px solid var(--on-surface-variant, #49454F);
            position: relative;
            padding: 8px 42px 6px 16px;
        }

        .text-field label {
            display: block;
            font-size: 14px;
            color: var(--on-surface-variant, #49454F);
            margin-bottom: 4px;
        }

        .text-field input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 17px;
            color: var(--on-surface, #1D1B20);
        }

        .text-field input::placeholder {
            color: var(--on-surface-variant, #49454F);
            opacity: 1;
        }

        .clear-icon {
            position: absolute;
            right: 12px;
            top: 16px;
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .gender-box {
            width: 212px;
            grid-row: span 3;
            padding-top: 16px;
            border-top: 1px solid var(--outline-variant, #CAC4D0);
        }

        .gender-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--on-surface-variant, #49454F);
            margin-bottom: 20px;
        }

        .gender-option {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 28px;
            font-size: 22px;
        }

        .gender-option input {
            width: 24px;
            height: 24px;
            accent-color: var(--primary, #6750A4);
        }

        .btn-next {
            grid-column: 2;
            justify-self: end;
            width: 99px;
            height: 48px;
            border: none;
            border-radius: 24px;
            background: var(--primary, #6750A4);
            color: var(--on-primary, #FFFFFF);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back {
            grid-column: 1;
            justify-self: start;
            width: 99px;
            height: 48px;
            border: 1px solid var(--primary, #6750A4);
            border-radius: 24px;
            background: var(--surface-container-low, #FFFFFF);
            color: var(--primary, #6750A4);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-finish {
            grid-column: 2;
            justify-self: end;
            width: auto;
            height: 48px;
            padding: 0 24px;
            border: none;
            border-radius: 24px;
            background: var(--primary, #6750A4);
            color: var(--on-primary, #FFFFFF);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .form-step {
            display: contents;
        }

        .form-step[hidden] {
            display: none;
        }

        .message {
            grid-column: 1 / 3;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
        }

        .success {
            color: #1B7F3A;
        }

        .error {
            color: #B3261E;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <section class="cadastro-page">
        <article class="cadastro-card">
            <div class="cadastro-card-header">
                <div class="cadastro-card-title">
                    <img src="/icons/account_circle.svg" alt="Cadastro">
                    <span>Cadastro</span>
                </div>

                <div class="cadastro-close">&times;</div>
            </div>

            <form id="cadastroForm" class="form-area" action="/cadastro" method="post">
                <div class="form-step" data-step="1">
                    <div class="text-field">
                        <label>Nome</label>
                        <input name="nome" placeholder="Nome completo" required>
                    </div>

                    <div class="text-field">
                        <label>CPF</label>
                        <input name="cpf" maxlength="11" placeholder="xxx.xxx.xxx-xx" required>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Username</label>
                        <input name="username" placeholder="Nome de usu&aacute;rio" required>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Telefone</label>
                        <input name="telefone" maxlength="11" placeholder="xx xxxxx xxxx" required>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Email</label>
                        <input name="email" type="email" placeholder="email@email" required>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="gender-box">
                        <div class="gender-title">G&ecirc;nero</div>

                        <label class="gender-option">
                            <input type="radio" name="genero" value="M" checked>
                            Masculino
                        </label>

                        <label class="gender-option">
                            <input type="radio" name="genero" value="F">
                            Feminino
                        </label>

                        <label class="gender-option">
                            <input type="radio" name="genero" value="O">
                            Outro
                        </label>
                    </div>

                    <div class="text-field">
                        <label>Senha</label>
                        <input name="password" type="password" placeholder="*****" required>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <button id="btnSeguinte" class="btn-next" type="button">Seguinte</button>
                </div>

                <div class="form-step" data-step="2" hidden>
                    <div class="text-field">
                        <label>CEP</label>
                        <input name="cep" maxlength="8" placeholder="00000000" required disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Rua</label>
                        <input name="rua" placeholder="Rua" required disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>N&uacute;mero</label>
                        <input name="numero" placeholder="N&uacute;mero" required disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Complemento</label>
                        <input name="complemento" placeholder="Complemento" disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Bairro</label>
                        <input name="bairro" placeholder="Bairro" required disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Cidade</label>
                        <input name="cidade" placeholder="Cidade" required disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <div class="text-field">
                        <label>Estado</label>
                        <input name="uf" maxlength="2" placeholder="UF" required disabled>
                        <img class="clear-icon" src="/icons/field-icon.svg" alt="">
                    </div>

                    <button id="btnVoltar" class="btn-back" type="button">Voltar</button>
                    <button class="btn-finish" type="submit">Finalizar Cadastro</button>
                </div>

                <div class="message success" th:if="${success}" th:text="${success}"></div>
                <div class="message error" th:if="${error}" th:text="${error}"></div>
            </form>
        </article>
    </section>

    <script>
        const cadastroForm = document.getElementById("cadastroForm");
        const primeiraEtapa = cadastroForm.querySelector('[data-step="1"]');
        const segundaEtapa = cadastroForm.querySelector('[data-step="2"]');
        const camposEndereco = segundaEtapa.querySelectorAll("input");
        const btnSeguinte = document.getElementById("btnSeguinte");
        const btnVoltar = document.getElementById("btnVoltar");

        function mostrarPrimeiraEtapa() {
            primeiraEtapa.hidden = false;
            segundaEtapa.hidden = true;
            camposEndereco.forEach((campo) => {
                campo.disabled = true;
            });
        }

        function mostrarSegundaEtapa() {
            camposEndereco.forEach((campo) => {
                campo.disabled = false;
            });
            primeiraEtapa.hidden = true;
            segundaEtapa.hidden = false;
        }

        btnSeguinte.addEventListener("click", () => {
            if (cadastroForm.reportValidity()) {
                mostrarSegundaEtapa();
            }
        });

        btnVoltar.addEventListener("click", mostrarPrimeiraEtapa);

        cadastroForm.addEventListener("submit", (event) => {
            if (segundaEtapa.hidden) {
                event.preventDefault();
                if (cadastroForm.reportValidity()) {
                    mostrarSegundaEtapa();
                }
            }
        });
    </script>
</div>
</body>
</html>
